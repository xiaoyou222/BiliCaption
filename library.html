<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>标记库 · BiliCaption</title>
  <link rel="stylesheet" href="options.css" />
  <style>
    .shell { width: 100%; height: 100%; margin: 0; border: none; border-radius: 0; }
    .lib { position: relative; flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .lib-head {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 20px; border-bottom: 1px solid rgba(255,255,255,.07);
    }
    .lib-body { flex: 1; min-height: 0; display: flex; }
    .lib-side {
      width: 268px; flex: none; border-right: 1px solid rgba(255,255,255,.07);
      display: flex; flex-direction: column; min-height: 0;
    }
    .lib-side-scroll { flex: 1; min-height: 0; overflow: auto; padding: 8px; }
    .v-row {
      position: relative; display: flex; gap: 9px; padding: 8px; border-radius: 8px;
      cursor: pointer; margin-bottom: 2px;
    }
    .v-row:hover { background: rgba(255,255,255,.04); }
    .v-row.on { background: rgba(77,142,240,.14); }
    .v-thumb {
      position: relative; width: 56px; height: 34px; flex: none; border-radius: 5px;
      background: #1B1E23; border: 1px solid rgba(255,255,255,.07);
      overflow: hidden;
    }
    .v-thumb img {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .v-dur {
      position: absolute; right: 3px; bottom: 2px; z-index: 1;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 8.5px; color: #565C66; line-height: 1;
    }
    .v-thumb.has-cover .v-dur {
      color: #F0F1F3; text-shadow: 0 1px 2px rgba(0,0,0,.75);
    }
    .v-title { font-size: 11.5px; line-height: 15px; color: #C7CBD1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .v-row.on .v-title { color: #F0F1F3; }
    .v-meta { font-size: 10.5px; color: #565C66; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lib-trash { flex: none; margin-top: 6px; border-top: 1px solid rgba(255,255,255,.09); display: flex; flex-direction: column; }
    .lib-trash-head {
      display: flex; align-items: center; gap: 7px; border: none; background: transparent;
      color: #C7CBD1; font-size: 11px; padding: 11px 10px; cursor: pointer; flex: none;
    }
    .lib-trash-head:hover { background: rgba(255,255,255,.045); }
    .lib-trash-head .label { flex: none; color: #E7E9ED; }
    .lib-trash-head .count { flex: 1; min-width: 0; text-align: left; color: #6B7078; }
    .lib-trash-caret { font-size: 12px; color: #9BA0AA; flex: none; display: block; line-height: 11px; transition: transform .14s; }
    .lib-trash-caret.open { transform: rotate(180deg); }
    .lib-trash-list { overflow: auto; padding: 0 8px 8px; display: flex; flex-direction: column; gap: 2px; min-height: 0; }
    .t-row {
      display: flex; align-items: center; gap: 8px; padding: 7px 8px;
      border-radius: 7px; cursor: pointer; background: rgba(255,255,255,.03);
    }
    .t-row.on { background: rgba(77,142,240,.14); }
    .t-title {
      font-size: 11px; line-height: 15px; color: #9BA0AA;
      display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;
    }
    .t-row.on .t-title { color: #E7E9ED; }
    .t-meta { font-size: 10px; color: #565C66; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lib-trash-hint { font-size: 10px; color: #4A5058; padding: 4px 8px 0; }
    .lib-marks { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .lib-marks-head {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,.07);
    }
    .lib-marks-list { flex: 1; overflow: auto; padding: 8px 14px 12px; }
    .m-row { display: flex; gap: 11px; align-items: flex-start; padding: 8px; border-radius: 8px; cursor: pointer; }
    .m-row:hover { background: rgba(255,255,255,.04); }
    .m-row.dim { cursor: default; }
    .m-time { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 10.5px; line-height: 19px; color: #79ACF5; width: 38px; flex: none; }
    .m-row.dim .m-time { color: #5B6270; }
    .m-text { font-size: 11.5px; line-height: 19px; color: #C7CBD1; text-wrap: pretty; flex: 1; min-width: 0; }
    .m-row.dim .m-text { color: #8A9099; }
    .m-del {
      border: none; background: transparent; color: #6B7078;
      font-size: 13px; line-height: 19px; padding: 0 2px;
      cursor: pointer; flex: none; opacity: 0; pointer-events: none;
      transition: opacity .12s, color .12s;
    }
    .m-row:hover .m-del { opacity: 1; pointer-events: auto; color: #E86A6A; }
    .m-restore, .t-restore {
      border: 1px solid rgba(255,255,255,.14); background: transparent; color: #9BA0AA;
      font-size: 10.5px; line-height: 22px; padding: 0 8px; border-radius: 6px;
      cursor: pointer; flex: none;
    }
    .m-restore { line-height: 20px; opacity: 0; pointer-events: none; transition: opacity .12s; }
    .m-row:hover .m-restore { opacity: 1; pointer-events: auto; }
    .sync-dot { width: 5px; height: 5px; border-radius: 50%; background: #565C66; }
    .sync-dot.on { background: #3ECF8E; }
    .empty { flex: 1; display: flex; align-items: center; justify-content: center; color: #565C66; font-size: 12px; }
    .empty.soft { align-items: flex-start; padding: 26px 8px; font-size: 11.5px; }
    .search { width: 200px; padding: 6px 10px; font-size: 11.5px; font-family: inherit; }
    .lib-btn {
      border: 1px solid rgba(255,255,255,.14);
      background: transparent;
      color: #9BA0AA;
      font-size: 11px;
      line-height: 26px;
      padding: 0 10px;
      height: 26px;
      border-radius: 6px;
      cursor: pointer;
      flex: none;
    }
    .lib-btn.danger {
      border-color: rgba(232,106,106,.34);
      color: #E86A6A;
    }
    .lib-btn.ghost {
      border: none;
      color: #6B7078;
      padding: 0 4px;
    }
    .lib-undo {
      position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%);
      z-index: 60; padding: 9px 12px 9px 15px;
      border: 1px solid rgba(255,255,255,.1); background: #1C2230;
      border-radius: 9px; display: flex; align-items: center; gap: 12px;
      white-space: nowrap; box-shadow: 0 14px 36px rgba(0,0,0,.6);
    }
    .lib-undo-label { font-size: 11.5px; color: #E7E9ED; }
    .lib-undo-go {
      border: none; background: transparent; color: #79ACF5;
      font-size: 11.5px; font-weight: 500; padding: 2px 6px; border-radius: 5px; cursor: pointer; flex: none;
    }
    .lib-undo-x {
      border: none; background: transparent; color: #6B7078;
      font-size: 12px; padding: 0 2px; cursor: pointer; flex: none;
    }
    .trash-title {
      font-size: 11px; color: #8A9099; flex: none; max-width: 200px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .trash-meta { font-size: 11px; color: #565C66; flex: none; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="lib">
      <div id="libUndo" class="lib-undo hidden">
        <span id="libUndoLabel" class="lib-undo-label"></span>
        <button type="button" id="libUndoBtn" class="lib-undo-go">撤销</button>
        <button type="button" id="libUndoDismiss" class="lib-undo-x">×</button>
      </div>
      <div class="lib-head">
        <span class="logo"></span>
        <span style="font-size:13px;font-weight:600">标记库</span>
        <span id="libSync" style="display:flex;align-items:center;gap:5px;font-size:10.5px;color:#6B7078">
          <span class="sync-dot" id="libSyncDot"></span>
          <span id="libSyncLabel">未开启同步</span>
        </span>
        <div style="flex:1"></div>
        <input id="libQuery" class="search" type="search" placeholder="搜索标记内容或视频…" />
      </div>
      <div class="lib-body">
        <div class="lib-side">
          <div class="lib-side-scroll">
            <div id="libVideos"></div>
            <div id="libTrashWrap" class="lib-trash hidden">
              <button type="button" id="libTrashToggle" class="lib-trash-head">
                <span class="label">最近删除</span>
                <span id="libTrashCount" class="count"></span>
                <span id="libTrashCaret" class="lib-trash-caret">⌄</span>
              </button>
              <div id="libTrashList" class="lib-trash-list hidden"></div>
            </div>
          </div>
        </div>
        <div class="lib-marks">
          <div id="libToolbar" class="lib-marks-head hidden">
            <span id="libCurCount" style="font-size:11px;color:#565C66;flex:none">0 条标记</span>
            <button type="button" id="libOpen" class="lib-btn">打开视频</button>
            <button type="button" id="libExport" class="lib-btn">导出</button>
            <button type="button" id="libDeleteAll" class="lib-btn danger">删除全部标记</button>
            <div style="flex:1"></div>
          </div>
          <div id="libTrashBar" class="lib-marks-head hidden">
            <span id="libTrashSelTitle" class="trash-title"></span>
            <span id="libTrashSelMeta" class="trash-meta"></span>
            <button type="button" id="libTrashRestoreAll" class="lib-btn">全部恢复</button>
            <div style="flex:1"></div>
            <button type="button" id="libTrashClose" class="lib-btn ghost" title="退出">×</button>
          </div>
          <div id="libMarks" class="lib-marks-list hidden"></div>
          <div id="libEmpty" class="empty soft hidden">这个视频还没有标记</div>
          <div id="libNone" class="empty hidden">标记库还没有内容</div>
        </div>
      </div>
    </div>
  </div>
  <script src="lib/markers.js"></script>
  <script src="lib/webdav.js"></script>
  <script src="library.js"></script>
</body>
</html>
