<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BiliCaption</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <div class="panel">
    <header class="header">
      <svg id="siteIconB" class="site-icon hidden" viewBox="0 0 1024 1024" width="18" height="18" role="img" aria-label="B 站"><rect x="178" y="352" width="668" height="452" rx="78" fill="#FFFFFF"></rect><path d="M278.8864 148.1728c14.336-8.192 32.6144-9.3696 47.8208-2.6624 11.3664 4.6592 19.968 13.824 29.184 21.6064 38.144 32.9216 75.9808 66.304 114.2784 99.0208h80.4352c38.2976-32.768 76.0832-66.048 114.2272-98.9696 9.2672-7.7824 17.8688-16.896 29.2864-21.6576 14.7456-6.5024 32.4608-5.632 46.592 2.048 16.5888 8.5504 28.1088 26.2656 28.8256 44.9536 1.024 13.568-3.84 27.2896-12.3392 37.7856-7.5264 8.3456-16.5376 15.2064-24.8832 22.6816-5.3248 4.4032-10.1376 9.5232-16.0256 13.2096 23.6544 0 47.2576-0.256 70.912 0.1536 31.1296 0.8192 61.44 14.592 82.8928 37.1712 22.6304 22.2208 35.5328 53.5552 35.4816 85.1968 0.1024 108.4416 0 216.9344 0.0512 325.376-0.1024 16.384 0.8192 33.024-2.816 49.152-6.656 32.9728-28.8256 61.5936-56.9856 79.36a121.344 121.344 0 0 1-64.7168 17.7664H263.2704c-16.9984-0.1024-34.2528 0.8704-50.9952-2.8672-32.1024-6.4512-60.0064-27.648-77.824-54.6304a121.088 121.088 0 0 1-19.2512-66.9696v-321.536c0.1024-16.5376-0.9216-33.1776 2.4576-49.408 10.24-52.9408 58.9312-96.1024 112.9984-98.4576 24.6272-0.768 49.3056-0.2048 73.9328-0.3072-11.6224-8.3968-21.8112-18.5344-32.768-27.7504a55.04 55.04 0 0 1-20.5312-45.9264c0.7168-18.2272 11.6736-35.584 27.648-44.3392m-13.056 221.7984c-20.992 3.7376-38.912 20.3264-44.7488 40.7552a76.4928 76.4928 0 0 0-2.3552 21.7088c0.1024 89.0368-0.0512 178.0736 0.0512 267.1616-0.4096 24.2176 16.3328 47.1552 39.1168 54.8864 8.1408 2.9696 16.896 3.0208 25.3952 3.072 153.1904-0.1024 306.432 0.0512 459.6224-0.0512 22.4768 0.8704 44.0832-13.1072 53.5552-33.28 5.7856-11.5712 5.6832-24.7296 5.4784-37.376v-248.832c0-9.1136 0.3072-18.4832-2.304-27.2896a58.7776 58.7776 0 0 0-36.864-38.656c-9.7792-3.584-20.4288-3.0208-30.6688-3.072H292.5056c-8.8576 0-17.8176-0.3072-26.624 0.9728z" fill="#1296DB"></path><path d="M358.7072 455.5264c14.6432-1.4848 29.8496 3.2768 41.0112 12.8 12.4416 10.24 19.5584 26.112 19.7632 42.1376 0.3584 19.4048 0.1024 38.8608 0.1024 58.2656 0 12.8-3.3792 25.8048-11.3152 35.9424a54.9888 54.9888 0 0 1-48.4864 21.76 54.9376 54.9376 0 0 1-44.032-28.2624c-6.8096-11.6736-7.3728-25.4976-7.168-38.6048 0.4096-18.8416-1.024-37.7856 0.8704-56.576a55.296 55.296 0 0 1 49.2544-47.4624z m292.4544 0a55.2448 55.2448 0 0 1 60.7232 53.0432c0.8192 18.2272 0.1024 36.4544 0.4096 54.6816 0.1024 12.8-1.4336 26.112-8.4992 37.12-10.24 17.0496-30.3104 27.5456-50.176 26.112a55.04 55.04 0 0 1-43.3664-24.9856c-7.936-11.776-9.472-26.2656-9.1136-40.0896 0.3584-18.7392-0.6656-37.4784 0.6144-56.1664 1.8432-25.6 23.9104-47.5136 49.408-49.664z" fill="#1296DB"></path></svg>
      <svg id="siteIconY" class="site-icon hidden" viewBox="0 0 1024 1024" width="16" height="16" role="img" aria-label="YouTube"><rect x="70" y="185" width="884" height="654" rx="150" fill="#FFFFFF"></rect><path d="M426.667 682.667V384l256 149.845-256 148.822z m587.093-355.542s-10.027-71.04-40.704-102.357c-38.955-41.088-82.603-41.259-102.613-43.648-143.275-10.453-358.23-10.453-358.23-10.453h-0.426s-214.955 0-358.23 10.453c-20.053 2.39-63.658 2.56-102.656 43.648-30.677 31.317-40.661 102.4-40.661 102.4S0 410.538 0 493.952v78.293c0 83.456 10.24 166.912 10.24 166.912s9.984 71.04 40.661 102.358c38.998 41.088 90.155 39.765 112.939 44.074C245.76 893.568 512 896 512 896s215.168-0.341 358.443-10.752c20.053-2.432 63.658-2.603 102.613-43.69 30.72-31.318 40.704-102.4 40.704-102.4s10.24-83.414 10.24-166.87v-78.25c0-83.457-10.24-166.913-10.24-166.913z" fill="#FF0000"></path></svg>
      <svg id="siteIconX" class="site-icon hidden" viewBox="0 0 1024 1024" width="16" height="16" role="img" aria-label="X"><rect x="40" y="40" width="944" height="944" rx="215" fill="#E7E9ED"></rect><g transform="translate(512 512) scale(0.46) translate(-512 -512)"><path d="M761.759375 122h132.320625L605 452.4003125 945.08 902H678.8L470.24 629.3196875 231.599375 902H99.2l309.1996875-353.4L82.16 122h273.0403125l188.52 249.24z m-46.4390625 700.8h73.32L315.359375 197.0403125h-78.680625z" fill="#15181D"></path></g></svg>
      <span id="loginDot" class="login-dot hidden"></span>
      <span id="loginLabel" class="login-label hidden">未登录</span>
      <div id="headerTitle" class="header-title">等待视频</div>
      <div class="header-actions">
        <div id="speedSelect" class="speed-wrap hidden">
          <button id="speedBtn" type="button" class="speed-btn" aria-label="倍速" aria-haspopup="listbox" aria-expanded="false">
            <span id="speedValue">1×</span>
          </button>
          <div id="speedMenu" class="speed-menu hidden" role="listbox"></div>
        </div>
        <button id="btnFloat" type="button">浮窗</button>
        <button id="btnSettings" type="button">设置</button>
      </div>
    </header>

    <div id="noVideoView" class="state-view">
      <div id="noVideoTitle" class="empty-title">正在读取当前标签…</div>
      <div id="lastVideoHint" class="empty-meta"></div>
    </div>

    <div id="videoView" class="video-view hidden">
      <div id="viewTabs" class="view-tabs hidden">
        <button type="button" data-view="captions" class="active">字幕</button>
        <button type="button" data-view="outline">大纲</button>
        <button type="button" data-view="markers">标记</button>
        <div class="job-pill-slot">
          <div id="jobPill" class="job-pill hidden">
            <button id="jobPillHead" type="button" class="job-pill-head" aria-expanded="false" aria-controls="jobPillBody">
              <span id="jobPillOrb" class="job-pill-orb"></span>
              <span id="jobPillLabel" class="job-pill-label">转写中</span>
              <span class="job-pill-head-fill" aria-hidden="true"></span>
              <span class="job-pill-chevron" aria-hidden="true">
                <svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 3.5 L5 6.5 L8 3.5" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>
              </span>
            </button>
            <div id="jobPillBody" class="job-pill-body">
              <div class="job-pill-body-inner">
                <div id="asrJobBar" class="job-seg hidden">
                  <div id="asrSwitchNote" class="job-switch-note hidden"></div>
                  <div class="job-seg-head">
                    <span id="asrJobTitle" class="asr-job-title">转写中</span>
                    <span id="asrSegPct" class="job-seg-pct"></span>
                  </div>
                  <div id="asrJobTrack" class="job-seg-track" role="progressbar" aria-label="字幕转写进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="asrJobFill" class="asr-job-fill"></div></div>
                  <div id="chunkLiveList" class="chunk-live"></div>
                  <button id="btnChunkFold" type="button" class="chunk-fold hidden"></button>
                  <div id="chunkDoneList" class="chunk-done hidden"></div>
                  <div class="job-seg-actions">
                    <button id="btnPauseAsr" type="button" class="job-btn">暂停</button>
                    <button id="btnCancelAsrJob" type="button" class="job-btn">取消转写</button>
                  </div>
                </div>
                <div id="trJobBar" class="job-seg hidden">
                  <div class="job-seg-head tr">
                    <span id="trJobTitle" class="asr-job-title tr">翻译中</span>
                    <span id="trSegPct" class="job-seg-pct"></span>
                    <button id="btnCancelTrJob" type="button" class="job-btn">取消翻译</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div id="captionLang" class="lang-switch hidden" role="group" aria-label="字幕语言">
          <button type="button" data-lang="zh" class="active" aria-pressed="true">中</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>

      <div id="emptyView" class="state-view hidden">
        <div id="emptyTitle" class="empty-title">这个视频没有字幕</div>
        <button id="btnGenerateEmpty" type="button" class="btn-primary lg">生成字幕</button>
        <div id="emptyFetchHint" class="empty-note hidden">可<button type="button" id="emptyRetryLink" class="link-btn">重试</button></div>
        <div id="emptyKeyHint" class="empty-note hidden">还没配置 API Key · <button type="button" id="openSettingsLink" class="link-btn">打开设置</button></div>
      </div>

      <div id="generatingView" class="gen-view hidden">
        <div id="genThink" class="think-host"></div>
        <button id="btnCancelGen" type="button" class="btn-ghost">取消</button>
      </div>

      <div id="errorView" class="state-view hidden">
        <div id="errorTitle" class="empty-title">未登录 B 站</div>
        <button id="errorPrimary" type="button" class="btn-primary lg">去登录</button>
      </div>

      <div id="outlineEmpty" class="state-view hidden">
        <div id="outlineEmptyOrb" class="think-host hidden"></div>
        <div id="outlineEmptyLabel" class="empty-title">还没有生成大纲</div>
        <button id="btnGenOutline" type="button" class="btn-primary lg">生成大纲</button>
      </div>

      <div id="outlineHead" class="outline-head hidden">
        <div id="outlineThink" class="think-host"></div>
        <span id="outlineHeadLabel">正在生成大纲</span>
        <button id="btnStopOutline" type="button" class="outline-stop">停止</button>
      </div>

      <div id="videoSummary" class="video-summary hidden">
        <button type="button" id="videoSummaryToggle" class="video-summary-toggle" aria-expanded="true">
          <span>全片总结</span>
          <span id="videoSummaryChevron" class="video-summary-chevron">▾</span>
        </button>
        <div id="videoSummaryBody" class="video-summary-body"></div>
      </div>

      <div id="outlineMeta" class="outline-meta hidden">
        <span id="outlineMetaLabel" class="outline-meta-label"></span>
        <div id="outlineDensity" class="outline-density" title="简略只看章，详情展开每章的小节">
          <button type="button" data-density="brief">简略</button>
          <button type="button" data-density="detail">详情</button>
        </div>
      </div>

      <div id="outlineList" class="outline hidden"></div>

      <div id="summaryBox" class="summary hidden">
        <div class="summary-head">
          <div class="summary-title-row">
            <span id="summaryThink" class="think-host hidden"></span>
            <span id="summaryTitle">选区总结</span>
            <span id="summaryMeta" class="summary-meta"></span>
          </div>
          <div class="summary-actions">
            <button id="btnAddMarkerSummary" type="button" class="btn-mark">+ 标记</button>
            <button id="btnCopySummary" type="button" class="btn-copy-sm">复制</button>
            <button id="btnCloseSummary" type="button" class="summary-close" aria-label="关闭">×</button>
          </div>
        </div>
        <p id="summaryText" title="双击可编辑"></p>
        <textarea id="summaryEdit" class="summary-edit hidden"></textarea>
      </div>

      <div id="cueWrap" class="cue-wrap hidden">
        <div id="cueList" class="cues"></div>
        <div id="selKeyHint" class="sel-key-hint hidden" aria-hidden="true">划动选择字幕</div>
        <div id="cueGhosts" class="cue-ghosts hidden"></div>
      </div>

      <div id="selectBar" class="select-bar hidden">
        <span id="selectInfo">点两行字幕作为起止</span>
        <div class="select-actions">
          <button id="btnLoopSel" type="button" class="btn-loop" aria-pressed="false">循环</button>
          <button id="btnCopy" type="button" class="btn-outline">复制</button>
          <button id="btnSummary" type="button" class="btn-primary">总结</button>
          <button id="btnClearSelect" type="button" class="btn-text" aria-label="取消划选">×</button>
        </div>
      </div>

      <div id="outlineBar" class="action-bar hidden">
        <button id="btnCopyOutline" type="button" class="btn-primary">复制大纲</button>
        <button id="btnOutlineMd" type="button" class="btn-outline">下载 Markdown</button>
        <button id="btnRegenOutline" type="button" class="btn-outline">重新生成</button>
      </div>

      <div id="markerView" class="marker-view hidden">
        <div id="markerList" class="markers"></div>
        <div id="markerEmpty" class="state-view hidden">
          <div class="empty-title">还没有标记</div>
          <div class="empty-note">划选字幕并总结后点「添加标记」插入，也可以手动添加</div>
          <div class="marker-empty-actions">
            <button id="btnAddMarkerEmpty" type="button" class="btn-outline">+ 标记</button>
            <button id="btnLibraryEmpty" type="button" class="btn-outline">标记库 ›</button>
          </div>
        </div>
      </div>

      <div id="markerBar" class="action-bar hidden">
        <button id="btnAddMarker" type="button" class="btn-outline">+ 标记</button>
        <div style="flex:1"></div>
        <button id="btnLibrary" type="button" class="btn-outline">标记库 ›</button>
        <div class="more-wrap">
          <button id="btnMarkerMore" type="button" class="btn-outline">更多 ⋯</button>
          <div id="markerMoreMenu" class="more-menu hidden">
            <button id="btnCopyMarkers" type="button">复制</button>
            <button id="btnMarkerMd" type="button">导出 MD</button>
            <button id="btnMarkerCsv" type="button">导出 CSV</button>
          </div>
        </div>
      </div>

      <div id="actionBar" class="action-bar hidden">
        <button id="btnSelect" type="button" class="btn-outline">划选</button>
        <button id="btnMarkNow" type="button" class="btn-outline">标记</button>
        <button id="btnOverlay" type="button" class="btn-outline">显示字幕</button>
        <div class="more-wrap">
          <button id="btnMore" type="button" class="btn-outline">更多 ⋯</button>
          <div id="moreMenu" class="more-menu hidden">
            <button id="btnGenerate" type="button">重新生成字幕</button>
            <button id="btnSrt" type="button">下载 SRT</button>
            <button id="btnTxt" type="button">下载纯文本</button>
            <button id="btnTranslate" type="button">翻译成中文</button>
            <button id="btnClearCache" type="button" class="danger" title="只清理本插件生成的转写、翻译和大纲，不影响视频自带字幕；网盘上有字幕备份时会先确认是否一起删除">清理缓存</button>
          </div>
        </div>
      </div>
    </div>

    <canvas id="selectTrail" class="select-trail hidden" aria-hidden="true"></canvas>
    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="lib/thinking-orbs-engine.js"></script>
  <script src="lib/thinking-orb.js"></script>
  <script src="lib/border-beam.js"></script>
  <script src="lib/字幕工具.js"></script>
  <script src="lib/zh-simp.js"></script>
  <script src="lib/translate.js"></script>
  <script src="lib/outline.js"></script>
  <script src="lib/模型路由.js"></script>
  <script src="lib/模型调用.js"></script>
  <script src="lib/视频平台.js"></script>
  <script src="lib/markers.js"></script>
  <script src="lib/providers.js"></script>
  <script src="lib/prefs.js"></script>
  <script src="侧栏/基础.js"></script>
  <script src="侧栏/标签页通信.js"></script>
  <script src="侧栏/中英字幕.js"></script>
  <script src="侧栏/顶栏与标记.js"></script>
  <script src="侧栏/动效.js"></script>
  <script src="侧栏/后台任务.js"></script>
  <script src="侧栏/字幕列表.js"></script>
  <script src="侧栏/选区.js"></script>
  <script src="侧栏/大纲.js"></script>
  <script src="侧栏/页面状态.js"></script>
  <script src="侧栏/生成与翻译.js"></script>
  <script src="侧栏/总结与模型.js"></script>
  <script src="侧栏/快捷键与设置.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
